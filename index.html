<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AURÉ · Probador Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- Mapea los imports "desnudos" a CDN, así el JS de abajo no necesita build step -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>

  <div id="stage">
    <div id="mirror">
      <video id="cam" playsinline autoplay muted></video>
      <canvas id="glCanvas"></canvas>
    </div>
  </div>

  <header id="brand">
    <div class="word">AURÉ</div>
    <div class="sub">Probador Virtual</div>
  </header>

  <button id="closeBtn" title="Cerrar">
    <svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
  </button>

  <div id="faceHint">Centrá tu rostro en cámara</div>

  <!-- Ajuste fino por modelo (tamaño / altura / profundidad) -->
  <aside id="tune">
    <div class="slider-group">
      <input id="sizeRange" type="range" min="-100" max="100" value="0" />
      <label>Tamaño</label>
    </div>
    <div class="slider-group">
      <input id="yRange" type="range" min="-100" max="100" value="0" />
      <label>Altura</label>
    </div>
    <div class="slider-group">
      <input id="zRange" type="range" min="-100" max="100" value="0" />
      <label>Profund.</label>
    </div>
    <button id="copyOffsets" title="Copiar offsets del modelo activo">Copiar</button>
  </aside>

  <!-- Dock inferior -->
  <div id="dock">
    <div id="models"><!-- chips generados por JS --></div>
    <div id="actions">
      <button class="icon-btn" id="tuneBtn" title="Ajuste fino">
        <svg viewBox="0 0 24 24"><line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.5"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.5"/></svg>
      </button>
      <button id="shutter" title="Sacar foto"><span class="core"></span></button>
      <button class="icon-btn" id="shareBtn" title="Compartir / descargar" disabled>
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><line x1="8" y1="10.8" x2="16" y2="7"/><line x1="8" y1="13.2" x2="16" y2="17"/></svg>
      </button>
    </div>
  </div>

  <!-- Estado: inicio -->
  <div class="veil" id="start">
    <div class="word">AURÉ</div>
    <div class="tag">Probador Virtual</div>
    <p>Probate cualquier modelo en tiempo real. Vas a necesitar permitir el acceso a la cámara.</p>
    <button class="cta" id="startBtn">Comenzar</button>
  </div>

  <!-- Estado: cargando -->
  <div class="veil hidden" id="loading">
    <div class="dot-loader"><span></span><span></span><span></span></div>
    <p id="loadingMsg">Encendiendo la cámara…</p>
  </div>

  <!-- Estado: error -->
  <div class="veil hidden" id="error">
    <div class="tag" style="color:var(--hueso)">Algo salió mal</div>
    <p id="errorMsg"></p>
    <button class="cta" id="retryBtn">Reintentar</button>
  </div>

  <div id="flash"></div>
  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
